software:
  - name: citest
    url: https://github.com/MIDASverse/citest
    text: Python package (on PyPI) for testing conditional independence in incomplete regression analysis with machine learning methods. With Thomas Robinson.
  - name: citestR
    url: https://cran.r-project.org/web/packages/citestR/index.html
    text: R package (on CRAN) equivalent of <code>citest</code>. With Thomas Robinson.
  - name: MIDASpy
    url: https://github.com/MIDASverse/MIDASpy
    text: Python package (on PyPI) for accurate and efficient multiple imputation with deep learning methods. With Thomas Robinson and Alex Stenlake.
  - name: rMIDAS
    sep: ":"            # what follows the name; a full stop unless given
    url: https://cran.r-project.org/web/packages/rMIDAS/index.html
    text: "Multiple Imputation with Denoising Autoencoders. R package (on CRAN) equivalent of <code>MIDASpy</code>. With Thomas Robinson and Alex Stenlake."

